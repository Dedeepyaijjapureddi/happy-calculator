<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

    <!-- LEFT SIDE : CALCULATOR -->
    <div class="calculator">

        <h1>😊 Happy Calculator</h1>

        <div class="theme-toggle">
            <span>☀️</span>

            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>

            <span>🌙</span>
        </div>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()">=</button>

        </div>

        <p id="message">Let's calculate something! 😊</p>

    </div>


    <!-- RIGHT SIDE -->
    <div class="side-panel">

        <!-- HISTORY -->
        <div class="card">
    <h2>📝 Calculation History</h2>

    <ul id="history"></ul>

    <button class="clear-history" onclick="clearHistory()">
        🗑️ Clear History
    </button>
        </div>


        <!-- MATH CHALLENGE -->
        <div class="card challenge">

            <h2>🎯 Math Challenge</h2>

            <p id="question">Click Start to get a question!</p>

            <button onclick="startChallenge()" class="challenge-btn">
                ▶ Start Challenge
            </button>

            <input
                type="number"
                id="answer"
                placeholder="Enter answer"
            >

            <button onclick="checkAnswer()" class="challenge-btn">
                ✓ Check Answer
            </button>

            <p id="challengeMessage"></p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
